services:
  gateway:
    build:
      context: .
      dockerfile: School.API/Gateway/School.APIGateway/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      - identity-api

  identity-api:
    build:
      context: .
      dockerfile: School.API/Identity/School.Identity.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__SchoolConnection=Data Source=host.docker.internal,64619;Initial Catalog=School;User ID=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
      - JwtConfigurations__Secret=${JWT_SECRET}